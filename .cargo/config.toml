# Windows: link the MSVC C runtime statically (/MT family).
#
# The vendored libjxl build (jpegxl-src) compiles with the static CRT on
# MSVC, which historically rode along harmlessly. v0.2.8's statically-
# linked libheif made the mismatch real: a dynamic-CRT (/MD) heif.lib
# pulls msvcprt while jxl's objects demand libcpmt → LNK2005 duplicate
# C++ runtime symbols. Making the whole target static-CRT keeps every
# native dep (jxl, heif, de265, sqlite, ring) on one runtime.
#
# Distribution bonus: the shipped Goop.exe no longer needs the VC++
# redistributable present on user machines — Tauri's recommended
# posture for Windows.
#
# vcpkg pairing: the `vcpkg` crate auto-selects the x64-windows-static
# triplet when crt-static is set (CI also sets VCPKGRS_TRIPLET
# explicitly for clarity).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# macOS: point pkg-config at the prebuilt static HEIC decode stack that
# scripts/build-static-heif-deps.sh drops in .heif-deps, so `cargo build`
# works without per-shell exports.
#
# `relative = true` resolves against the parent of the config file that
# defines it. Note this file is tracked, so a linked worktree checks out its
# OWN copy, which cargo finds first — the path there resolves to that
# worktree's .heif-deps, NOT this one. A worktree therefore still needs a
# .heif-deps of its own; a symlink to the primary checkout's is enough. Do
# not assume it is inherited.
#
# These do NOT override an already-set environment variable (no `force`), so
# CI's macOS legs — which export both to $GITHUB_ENV before building — still
# win, and a developer can override either for a one-off build. On Windows
# libheif-sys cfg-gates pkg-config out entirely in favour of vcpkg, so both
# values are inert there.
#
# Caveat worth knowing: pkg-config also searches its own built-in paths, so a
# machine with Homebrew's libheif installed will link that (dynamically, at
# whatever version brew has) if .heif-deps is missing or stale — silently,
# with no error. Only CI's static-link check catches that drift.
[env]
SYSTEM_DEPS_LIBHEIF_LINK = "static"
PKG_CONFIG_PATH = { value = ".heif-deps/lib/pkgconfig", relative = true }
