[package]
name = "goop-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
tauri-codegen = { version = "=2.6.3", default-features = false }
tauri-plugin = { version = "=2.6.3", default-features = false }

[dependencies]
goop-core = { path = "../crates/goop-core" }
goop-sidecar = { path = "../crates/goop-sidecar" }
goop-extractor = { path = "../crates/goop-extractor" }
goop-converter = { path = "../crates/goop-converter", features = ["heic-thumbnail-preview"] }
goop-queue = { path = "../crates/goop-queue" }
goop-config = { path = "../crates/goop-config" }
goop-pdf = { path = "../crates/goop-pdf" }
goop-metadata = { path = "../crates/goop-metadata" }
# Keep the tested runtime/support family aligned with the locked JavaScript API.
# Newer support minors are incompatible with this runtime despite caret ranges.
tauri = { version = "=2.11.6", features = ["protocol-asset"] }
tauri-runtime = { version = "=2.11.3", default-features = false }
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-macros = { version = "=2.6.3", default-features = false }
tauri-utils = { version = "=2.9.3", default-features = false }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
ts-rs.workspace = true
parking_lot = "0.12"
anyhow.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"], default-features = false }
semver = "1.0"
sha2 = "0.10"
futures-util = "0.3"
trash = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
dashmap = "6"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
