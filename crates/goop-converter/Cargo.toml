[package]
name = "goop-converter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goop-core = { path = "../goop-core" }
goop-sidecar = { path = "../goop-sidecar" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "avif", "hdr", "ico"] }
# HEIC + JPEG-XL via C-binding crates that link at compile time against
# system libraries (Homebrew on macOS, vcpkg on Windows). Production
# bundling of libheif + libjxl dylibs lands in v0.2.5.1; for now the
# dev build relies on system libs at runtime. Camera RAW (`rawler`)
# also defers to v0.2.5.1 — its develop pipeline is heavier than a
# single phase's worth of work.
libheif-rs = "2.4"
jpegxl-rs = "0.11"
# Phase 6 text watermark: imageproc owns the high-level draw_text_mut
# helper that composites a rasterized glyph buffer onto a DynamicImage
# via the `image` crate's pixel types. ab_glyph is its font loader.
# The bundled font file is `assets/Roboto-Regular.ttf` (Apache-2.0) —
# loaded via `include_bytes!` so it ships as part of the crate binary.
imageproc = "0.25"
ab_glyph = "0.2"
# Phase 7 AppIcon: pure-Rust container builders for the platform
# icon formats. `icns` writes the Apple icon container; `ico` writes
# the Windows icon container.
icns = "0.3"
ico = "0.4"
# Phase 8 metadata: img-parts walks JPEG segment chains and PNG chunk
# streams so we can copy EXIF (APP1) and ICC (APP2 / iCCP) bytes from
# input to output. Pure-Rust; no system deps. PNG, JPEG, RIFF only —
# matches the v0.2.5 supported preserve matrix.
img-parts = "0.3"
