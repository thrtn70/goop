[package]
name = "goop-converter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goop-core = { path = "../goop-core" }
goop-sidecar = { path = "../goop-sidecar" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
# Subtitle charset detection. chardetng is Firefox's detector and
# encoding_rs supplies the label names; both are pure Rust, so the
# static-link story for the release builds is unaffected. ffmpeg's
# -sub_charenc accepts encoding_rs label names verbatim (verified
# against windows-1252/1251 and ISO-8859-2).
chardetng = "0.1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "avif", "hdr", "ico"] }
# JPEG-XL via jpegxl-rs's `vendored` feature: jpegxl-src builds libjxl
# 0.11 from vendored source via cmake at build time, statically linking
# the result into our binary. Avoids the per-platform libjxl version
# mismatch (Ubuntu apt's 0.7 vs Homebrew/vcpkg's 0.11) that broke the
# v0.2.5 release matrix. Build prereq (handled in CI): cmake + a C/C++
# compiler on each runner.
jpegxl-rs = { version = "0.11", features = ["vendored"] }
# HEIC decode (v0.2.8) follows the same static pattern:
#   * scripts/build-static-heif-deps.sh builds pinned, checksum-verified
#     libde265 + libheif as static libs (every other codec explicitly
#     OFF) into .heif-deps/; the build probes them via PKG_CONFIG_PATH
#     with SYSTEM_DEPS_LIBHEIF_LINK=static.
#   * Deliberately NOT using libheif-sys's `embedded-libheif` feature:
#     its cmake config enables every codec it finds on the build host,
#     which non-deterministically dynamic-links x265 (GPL!), aom, dav1d
#     etc. on Homebrew machines. Our script pins the exact stack.
#   * On Windows MSVC the crate resolves libheif via vcpkg —
#     "libheif[core]:x64-windows-static" with VCPKGRS_TRIPLET set
#     gives the same minimal static stack ([core] suppresses the
#     default 'hevc' feature = GPL x265 encoder; libde265 is a core
#     dependency of the port; the pure static triplet matches the
#     repo-wide crt-static in .cargo/config.toml). Zero DLLs ship.
# Decode-only: libde265 is the only codec in the link. No x265 (encode-
# only → no GPL-2.0 component), no aom (AVIF is native via `image`).
# See LICENSING.md for the static-LGPL rationale.
libheif-rs = { version = "2.4", default-features = false, features = ["v1_17", "image"] }
# Phase 6 text watermark: imageproc owns the high-level draw_text_mut
# helper that composites a rasterized glyph buffer onto a DynamicImage
# via the `image` crate's pixel types. ab_glyph is its font loader.
# The bundled font file is `assets/Roboto-Regular.ttf` (Apache-2.0) —
# loaded via `include_bytes!` so it ships as part of the crate binary.
imageproc = "0.25"
ab_glyph = "0.2"
# Phase 7 AppIcon: pure-Rust container builders for the platform
# icon formats. `icns` writes the Apple icon container; `ico` writes
# the Windows icon container.
icns = "0.3"
ico = "0.4"
# Phase 8 metadata: img-parts walks JPEG segment chains and PNG chunk
# streams so we can copy EXIF (APP1) and ICC (APP2 / iCCP) bytes from
# input to output. Pure-Rust; no system deps. PNG, JPEG, RIFF only —
# matches the v0.2.5 supported preserve matrix.
img-parts = "0.3"

[dev-dependencies]
# Scratch dirs for the `#[ignore]`d real-ffmpeg tests.
tempfile = "3"
