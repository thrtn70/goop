[package]
name = "goop-converter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goop-core = { path = "../goop-core" }
goop-sidecar = { path = "../goop-sidecar" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "avif", "hdr", "ico"] }
# HEIC + JPEG-XL via C-binding crates. v0.2.6 hybrid strategy:
#   * jpegxl-rs uses `vendored` — jpegxl-src builds libjxl 0.11 from
#     vendored source via cmake at build time. Static link. Avoids
#     the per-platform libjxl version mismatch (Ubuntu apt's 0.7
#     vs Homebrew/vcpkg's 0.11) that broke the v0.2.5 release matrix.
#   * libheif-rs is system-linked. apt-get/brew/vcpkg install libheif
#     per platform; libheif-rs probes via pkg-config. `v1_17` feature
#     pins to the lowest libheif API we need (Ubuntu 24.04 ships 1.17,
#     macOS Homebrew ships 1.21, Windows vcpkg ships 1.21+).
# Build prereqs (handled in CI workflows):
#   * cmake + C/C++ compiler everywhere (jpegxl vendored build needs it)
#   * libheif-dev (Ubuntu 24.04+), libheif (brew), libheif (vcpkg)
#   * pkg-config / pkgconfiglite for libheif lookup
# Camera RAW (`rawler`) still defers — its develop pipeline is
# heavier than a single release window can absorb.
libheif-rs = { version = "2.4", default-features = false, features = ["v1_17", "image"] }
jpegxl-rs = { version = "0.11", features = ["vendored"] }
# Phase 6 text watermark: imageproc owns the high-level draw_text_mut
# helper that composites a rasterized glyph buffer onto a DynamicImage
# via the `image` crate's pixel types. ab_glyph is its font loader.
# The bundled font file is `assets/Roboto-Regular.ttf` (Apache-2.0) —
# loaded via `include_bytes!` so it ships as part of the crate binary.
imageproc = "0.25"
ab_glyph = "0.2"
# Phase 7 AppIcon: pure-Rust container builders for the platform
# icon formats. `icns` writes the Apple icon container; `ico` writes
# the Windows icon container.
icns = "0.3"
ico = "0.4"
# Phase 8 metadata: img-parts walks JPEG segment chains and PNG chunk
# streams so we can copy EXIF (APP1) and ICC (APP2 / iCCP) bytes from
# input to output. Pure-Rust; no system deps. PNG, JPEG, RIFF only —
# matches the v0.2.5 supported preserve matrix.
img-parts = "0.3"
