[package]
name = "goop-extractor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
goop-core = { path = "../goop-core" }
goop-sidecar = { path = "../goop-sidecar" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
ts-rs.workspace = true
regex = "1.10"
tracing.workspace = true
url = "2.5"
# Direct-URL fallback downloader (crates/goop-extractor/src/direct.rs):
# streams an arbitrary file when neither yt-dlp nor gallery-dl matches.
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
# sha2 backs the per-URL hash used to name resumable `.part` files.
sha2 = "0.10"

[dev-dependencies]
goop-queue = { path = "../goop-queue" }
tempfile = "3"
# start_paused time control for the retry-backoff tests (the workspace
# tokio "full" feature set does not include test-util).
tokio = { workspace = true, features = ["test-util"] }
# Mock HTTP server for the direct-downloader tests (range/resume, filename
# derivation) so they run without network access.
wiremock = "0.6"
# Enables goop-core's RecordingSink for asserting emitted progress events.
goop-core = { path = "../goop-core", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
