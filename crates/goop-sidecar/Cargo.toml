[package]
name = "goop-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
goop-core = { path = "../goop-core" }
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
which = "6"

[dev-dependencies]
tempfile = "3"
# Mock HTTP server for the gallery-dl Codeberg updater tests (latest-release
# lookup + asset download) so they run without network access.
wiremock = "0.6"
