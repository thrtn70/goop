[package]
name = "goop-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "5.0"
fs4 = { version = "1", features = ["sync"] }
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# CancellationToken only (JobSignals). Deliberately NOT a full tokio
# dependency — signals.rs polls the token futures by hand so this crate
# stays runtime-free.
tokio-util.workspace = true
uuid.workspace = true
ts-rs = { workspace = true, features = ["uuid-impl", "serde-json-impl"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

[features]
test-util = []

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
