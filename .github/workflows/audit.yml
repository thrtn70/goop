name: audit
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    # Stays on ubuntu-24.04 (current LTS; libwebkit2gtk-4.1 lives here).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Seconds, and placed first so a broken download helper fails here
      # rather than after the ten-minute HEIC build. Covers fetch_url's
      # retry and fail-on-error-status behaviour plus the guard that no
      # script downloads with a bare curl.
      - name: Script tests
        run: ./scripts/fetch-with-retry.test.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-directories: ~/.cargo/bin
      - name: System libs (Tauri 2 + image codecs)
        # v0.2.6: cmake added so jpegxl-sys's `vendored` feature can
        # build libjxl 0.11 from vendored source at compile time.
        # libjxl-dev is NOT installed — we use jpegxl-rs's vendored
        # feature to avoid the version-mismatch trap (apt ships 0.7,
        # we want 0.11). cmake is preinstalled on github runners but
        # we explicitly install it for resilience.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config cmake
      # v0.2.8: static HEIC decode stack. Pinned libde265 + libheif
      # built static by the script (every other codec OFF); apt's
      # libheif-dev is NOT used (it would dynamic-link and drift).
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .heif-deps
          key: heif-deps-${{ runner.os }}-${{ hashFiles('scripts/build-static-heif-deps.sh') }}
      - name: Static HEIC decode stack (libde265 + libheif)
        run: |
          ./scripts/build-static-heif-deps.sh
          echo "PKG_CONFIG_PATH=$PWD/.heif-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
      - name: Resolve target
        shell: bash
        run: echo "TARGET=$(rustc -vV | awk '/host/ {print $2}')" >> "$GITHUB_ENV"
      - name: Fetch sidecars (required for goop-tauri build)
        shell: bash
        run: ./scripts/fetch-sidecars.sh "$TARGET"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p goop-converter --all-targets --features heic-thumbnail-preview -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      # Tauri's CLI refuses to build when the Rust crate and @tauri-apps/api
      # sit on different major.minor versions. They drift on their own here:
      # Cargo.lock is gitignored by design, so the crate re-resolves to the
      # latest 2.x on every build, while package-lock.json is committed and
      # holds the npm half wherever it was last refreshed.
      #
      # Nothing else catches it. No PR job runs the bundler — the rust job
      # only `cargo check`s goop-tauri, and `tauri build` appears solely in
      # release.yml, on a tag. So the drift stayed invisible until a release
      # was cut, which is the worst possible moment to discover it. This
      # compares the two in seconds and needs no npm install, since the
      # resolved version is already recorded in the committed lockfile.
      - name: Tauri crate / npm parity
        run: |
          crate=$(cargo tree -p tauri --depth 0 | head -1 \
            | sed -E 's/^[^ ]+ v([0-9]+\.[0-9]+).*/\1/')
          npmv=$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/@tauri-apps/api']['version'])" \
            | cut -d. -f1,2)
          echo "tauri crate=$crate  @tauri-apps/api=$npmv"
          if [ "$crate" != "$npmv" ]; then
            echo "::error::tauri crate $crate and @tauri-apps/api $npmv differ — the bundler will refuse to build. Fix with: npm update @tauri-apps/api @tauri-apps/cli"
            exit 1
          fi
      - name: Security audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      # Keep both shipped and development dependencies free of advisories at
      # moderate severity or above. The lockfile makes the audited dependency
      # graph reproducible; low-severity advisories remain visible without
      # blocking maintenance.
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      # Same order as scripts/pre-push.sh. The local gate is a git hook and
      # can be bypassed; this is the only lint enforcement that always runs.
      - run: npm run lint
      - run: npm run test
      - run: node --test scripts/startup-fonts.test.mjs
      - run: npm run build

  legal:
    # AGPL firewall — see LICENSING.md. Two checks: no `mupdf-*`
    # Rust crate may enter the workspace dependency graph (would link
    # AGPL into goop's binary), and no `mupdf.js`/`mupdf.wasm`/`@mupdf/*`
    # may be imported into the WebView (would load AGPL into goop's
    # app process). The mutool/gs binaries live behind Command::spawn
    # and are the only sanctioned crossing of the boundary.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Rust dep graph clear of mupdf-*
        run: |
          if cargo tree --workspace --prefix none --edges normal,build,dev 2>/dev/null | grep -i mupdf; then
            echo "::error::mupdf-* crate present in workspace dependency graph. Goop is MIT and must spawn mutool/gs as subprocesses only. See LICENSING.md."
            exit 1
          fi
      - name: Frontend free of mupdf.js / mupdf.wasm imports
        run: |
          if grep -rEn "from ['\"]mupdf|require\(['\"]mupdf|@mupdf|mupdf\.js|mupdf\.wasm" src/ shared/ 2>/dev/null; then
            echo "::error::mupdf.js / mupdf.wasm / @mupdf import in src/ or shared/. WebView is goop's app process — AGPL would cross the boundary. See LICENSING.md."
            exit 1
          fi

  sidecar-smoke:
    strategy:
      # The two legs fetch from different upstreams and assert different
      # things (see the ffmpeg feature checks below — an encoder present
      # in gyan's Windows build can be absent from the osxexperts macOS
      # one). Cancelling one because the other failed hides half the
      # answer and, when the cause is a transient download, turns one
      # flaky fetch into two red checks.
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # fetch-sidecars.sh's macOS path generates src-tauri/tauri.macos.conf.json
      # (the sidecar dylib bundle map) with `node`. Declare the dependency
      # rather than leaning on the runner image happening to preinstall Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - name: Startup and performance harnesses (macOS)
        if: matrix.os == 'macos-14'
        run: node --test --test-concurrency=1 scripts/performance-baseline.test.mjs scripts/startup-baseline.test.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: matrix.os == 'macos-14'
        with: { python-version: "3.14.6" }
      - name: Resolve target
        shell: bash
        run: echo "TARGET=$(rustc -vV | awk '/host/ {print $2}')" >> "$GITHUB_ENV"
      - name: Fetch sidecars
        shell: bash
        run: ./scripts/fetch-sidecars.sh "$TARGET"
      - name: Extractor process lifecycle (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          CARGO_INCREMENTAL=0 cargo test -p goop-extractor --lib process:: -- --test-threads=1
      - name: Extractor process lifecycle and alias integrity (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          CARGO_INCREMENTAL=0 cargo test -p goop-extractor --lib windows_ -- --test-threads=1 --nocapture
      - name: Smoke test
        shell: bash
        run: |
          ls src-tauri/bin/
          # Verify binaries invoke
          "./src-tauri/bin/ffmpeg-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} -version
          "./src-tauri/bin/ffprobe-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} -version
          "./src-tauri/bin/yt-dlp-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
          "./src-tauri/bin/gallery-dl-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
          # gs + tesseract load co-located libraries — bundled dylibs via
          # @loader_path on macOS, sibling DLLs on Windows. --version exercises
          # that graph per-PR on both runners (release.yml covers the signed,
          # in-.app variant on macOS only, and only on tags).
          "./src-tauri/bin/gs-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
          "./src-tauri/bin/tesseract-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
      # Every sidecar must stay owner-writable. Tauri's bundler clears extended
      # attributes across Contents/ before signing, `cp` carries the mode in
      # from src-tauri/bin, and a read-only binary fails that step with
      # "failed to run xattr" naming no file — after a full release compile.
      # gs, tesseract and mutool come from Homebrew at 555 and hit exactly
      # that. No PR job runs the bundler (only release.yml, on a tag), so this
      # mode check is the cheap stand-in for one.
      - name: Sidecars are writable (bundler clears xattrs)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          bad=0
          for f in src-tauri/bin/*-"$TARGET"; do
            [ -f "$f" ] || continue
            if [ ! -w "$f" ]; then
              echo "::error::$f is not owner-writable ($(stat -f '%Sp' "$f")); the macOS bundler will fail on it"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "all sidecars writable"
          exit "$bad"
      # Subtitle support depends on optional ffmpeg build features, which
      # differ between the macOS and Windows sources: burn-in needs libass
      # (the `subtitles` filter) and the muxers need the text encoders.
      # Assert them per-PR so a sidecar version bump can't quietly remove
      # a shipped feature.
      - name: Subtitle capability check
        shell: bash
        run: |
          FFMPEG="./src-tauri/bin/ffmpeg-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          "$FFMPEG" -hide_banner -filters | grep -qw subtitles \
            || { echo "::error::ffmpeg is missing the libass 'subtitles' filter (burn-in)"; exit 1; }
          for enc in mov_text srt webvtt; do
            "$FFMPEG" -hide_banner -encoders | grep -qw "$enc" \
              || { echo "::error::ffmpeg is missing the '$enc' subtitle encoder"; exit 1; }
          done
      # v0.2.8: per-OS static HEIC stack + link guards. These graduated
      # from the Phase 0 spike (.github/workflows/heic-spike.yml,
      # deleted after the gate passed) so every PR re-proves the
      # static-link property the release builders rely on.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'macos-14'
        with:
          path: .heif-deps
          key: heif-deps-${{ runner.os }}-${{ hashFiles('scripts/build-static-heif-deps.sh') }}
      - name: Static HEIC stack (macOS)
        if: matrix.os == 'macos-14'
        run: |
          ./scripts/build-static-heif-deps.sh
          echo "PKG_CONFIG_PATH=$PWD/.heif-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
      - name: HEIC static link guard (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -euo pipefail
          cargo test -p goop-converter --features heic-thumbnail-preview heic
          BIN=$(cargo test -p goop-converter --features heic-thumbnail-preview --lib --no-run --message-format=json 2>/dev/null \
            | jq -er 'select(
                .executable != null
                and .target.name == "goop_converter"
                and .target.kind == ["lib"]
              ) | .executable')
          # Strong form: nothing outside /usr/lib + /System may appear —
          # guards against any codec dylib leaking back into the link.
          LEAKS=$(otool -L "$BIN" | tail -n +2 | grep -v "/usr/lib/\|/System/" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::non-system dylib references found:"
            echo "$LEAKS"
            exit 1
          fi
          echo "static link guard passed."
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'windows-latest'
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('scripts/install-windows-heif-deps.sh') }}
      - name: Static HEIC stack (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ./scripts/install-windows-heif-deps.sh
          echo "VCPKGRS_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=C:/vcpkg" >> "$GITHUB_ENV"
      # Compile-check the Windows-only Rust paths on a real Windows
      # runner. cfg(windows) code in goop-queue::process_control was
      # not exercised by the Linux audit job, so v0.2.0 hit two
      # tag-time regressions (windows-sys feature mismatch + missing
      # ntdll exports). Cross-compiling on Linux is blocked by C-deps
      # (sqlite3, ring) requiring a Windows toolchain we don't want
      # to install in CI; running natively here is cheaper and 100%
      # faithful to the release builder. v0.2.8 extends it: the HEIC
      # decode tests run here (exercising the vcpkg static link), and
      # goop-tauri is checked so the crt-static flip is validated
      # across the full dependency tree (sqlite, ring, tauri) on every
      # PR instead of first failing at tag time.
      - name: Cargo check (Windows-only paths)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p goop-queue --all-features
          cargo test -p goop-converter --features heic-thumbnail-preview heic
          BIN=$(CARGO_INCREMENTAL=0 cargo test -p goop-converter --release --features heic-thumbnail-preview --lib --no-run --message-format=json | python3 -c '
          import json
          import sys

          paths = []
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = message.get("target", {})
              if (
                  target.get("name") == "goop_converter"
                  and target.get("kind") == ["lib"]
                  and message.get("executable")
              ):
                  paths.append(message["executable"])
          paths = list(dict.fromkeys(paths))
          if len(paths) != 1:
              raise SystemExit(f"expected one goop_converter test executable, found {paths!r}")
          print(paths[0])
          ')
          printf 'HEIC_PREVIEW_TEST_BINARY=%s\n' "$BIN" >> "$GITHUB_ENV"
          mkdir -p dist
          cargo check -p goop-tauri --all-features
      - name: HEIC preview fresh-process memory (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = $env:HEIC_PREVIEW_TEST_BINARY
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "HEIC preview test executable is missing: $binary"
          }

          $cases = [ordered]@{
            baseline = "heic_preview_sampler::tests::memory_probe_baseline_without_decode"
            primary12mp = "heic_preview_sampler::tests::memory_probe_12mp_primary_with_512x384_thumbnail"
            primary48mp = "heic_preview_sampler::tests::memory_probe_48mp_primary_with_512x384_thumbnail"
            exact4mp = "heic_preview_sampler::tests::memory_probe_exact_4mp_thumbnail"
          }
          $results = @{}

          foreach ($case in $cases.GetEnumerator()) {
            $measurements = [System.Collections.Generic.List[long]]::new()
            for ($iteration = 0; $iteration -lt 6; $iteration++) {
              $arguments = @("--quiet", "--exact", $case.Value, "--ignored")
              $process = Start-Process -FilePath $binary -ArgumentList $arguments -NoNewWindow -PassThru
              $peak = [long]0
              while (-not $process.HasExited) {
                try {
                  $process.Refresh()
                  $peak = [Math]::Max($peak, [long]$process.PeakWorkingSet64)
                } catch {
                  # The process may exit between the status check and refresh.
                }
                Start-Sleep -Milliseconds 5
              }
              $process.WaitForExit()
              try {
                $process.Refresh()
                $peak = [Math]::Max($peak, [long]$process.PeakWorkingSet64)
              } catch {
                # Retain the last sampled peak after process exit.
              }
              if ($process.ExitCode -ne 0) {
                throw "HEIC preview memory probe $($case.Key) failed with exit code $($process.ExitCode)"
              }
              if ($peak -le 0) {
                throw "HEIC preview memory probe $($case.Key) did not report peak working set"
              }
              if ($iteration -gt 0) {
                $measurements.Add($peak)
              }
            }

            $ordered = @($measurements | Sort-Object)
            $median = [long]$ordered[2]
            $maximum = [long](($ordered | Measure-Object -Maximum).Maximum)
            $results[$case.Key] = $median
            $line = "HEIC_PREVIEW_MEMORY case=$($case.Key) samples=$([string]::Join(',', $measurements)) median=$median maximum=$maximum"
            $line | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          $primaryDelta = [Math]::Abs([long]$results.primary12mp - [long]$results.primary48mp)
          "HEIC_PREVIEW_MEMORY equal_thumbnail_median_delta=$primaryDelta limit=$(16MB)" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($primaryDelta -gt 16MB) {
            throw "Equal-thumbnail 12 MP and 48 MP median peak working sets differ by more than 16 MiB"
          }
      - name: Lossy WebP static link
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED=$(cargo tree -p webp@0.3.1 --depth 1 --prefix none)
          echo "$RESOLVED"
          grep -qx 'webp v0.3.1' <<<"$RESOLVED"
          grep -qx 'libwebp-sys v0.9.6' <<<"$RESOLVED"
          BIN=$(CARGO_INCREMENTAL=0 cargo test -p goop-converter --release --test webp_lossy --no-run --message-format=json | python3 -c '
          import json
          import sys

          paths = []
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = message.get("target", {})
              if target.get("name") == "webp_lossy" and message.get("executable"):
                  paths.append(message["executable"])
          if len(paths) != 1:
              raise SystemExit(f"expected one webp_lossy executable, found {paths!r}")
          print(paths[0])
          ')
          "$BIN"
          case "$RUNNER_OS" in
            macOS)
              stat -f 'lossy WebP test binary: %z bytes' "$BIN"
              LEAKS=$(otool -L "$BIN" | tail -n +2 | grep -v "/usr/lib/\|/System/" || true)
              if [ -n "$LEAKS" ]; then
                echo "::error::lossy WebP test references non-system dylibs:"
                echo "$LEAKS"
                exit 1
              fi
              ;;
            Windows)
              echo "lossy WebP test binary: $(stat -c %s "$BIN") bytes"
              DEPS=$(objdump.exe -p "$BIN")
              echo "$DEPS"
              if echo "$DEPS" | grep -qiE '(lib)?(webp|sharpyuv)[^ ]*\.dll'; then
                echo "::error::lossy WebP test dynamically depends on libwebp or libsharpyuv"
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac
          echo "lossy WebP static link guard passed."
      - name: Portable color static link
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED=$(cargo tree -p lcms2@6.2.0 --depth 1 --prefix none)
          echo "$RESOLVED"
          grep -qx 'lcms2 v6.2.0' <<<"$RESOLVED"
          grep -qx 'lcms2-sys v4.0.7' <<<"$RESOLVED"
          # lcms2-sys gives LCMS2_LIB_DIR precedence over its static feature.
          # Remove any cached sys artifact, then clear both override variables
          # for the exact proof build so a host archive cannot be substituted.
          cargo clean -p lcms2-sys
          BIN=$(CARGO_INCREMENTAL=0 env -u LCMS2_LIB_DIR -u LCMS2_INCLUDE_DIR cargo test -p goop-converter --release --test lcms_static --no-run --message-format=json | python3 -c '
          import json
          import sys

          paths = []
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = message.get("target", {})
              if target.get("name") == "lcms_static" and message.get("executable"):
                  paths.append(message["executable"])
          if len(paths) != 1:
              raise SystemExit(f"expected one lcms_static executable, found {paths!r}")
          print(paths[0])
          ')
          "$BIN"
          case "$RUNNER_OS" in
            macOS)
              stat -f 'portable color test binary: %z bytes' "$BIN"
              LEAKS=$(otool -L "$BIN" | tail -n +2 | grep -v "/usr/lib/\|/System/" || true)
              if [ -n "$LEAKS" ]; then
                echo "::error::portable color test references non-system dylibs:"
                echo "$LEAKS"
                exit 1
              fi
              ;;
            Windows)
              echo "portable color test binary: $(stat -c %s "$BIN") bytes"
              DEPS=$(objdump.exe -p "$BIN")
              echo "$DEPS"
              if echo "$DEPS" | grep -qiE 'lcms2[^ ]*\.dll'; then
                echo "::error::portable color test dynamically depends on Little CMS"
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac
          echo "portable color static link guard passed."
      - name: Image conversion correctness
        shell: bash
        run: |
          for suite in imagemagick::tests imagemagick_probe::tests raw jpeg_controls::tests exif_geometry::tests heif_header::tests image_read::tests preview::tests; do
            CARGO_INCREMENTAL=0 cargo test -p goop-converter --lib "$suite"
          done
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --example image_read_baseline
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test capabilities --test image_probe --test jpeg_controls --test preview
      - name: Image settings persistence contracts
        shell: bash
        run: |
          CARGO_INCREMENTAL=0 cargo test -p goop-core --test image_options_contract
          CARGO_INCREMENTAL=0 cargo test -p goop-core --test image_alpha_contract -- --list | tee image-alpha-contract-tests.txt
          test "$(grep -c ': test$' image-alpha-contract-tests.txt)" -eq 5
          for test_name in \
            alpha_policy_and_receipt_round_trip_exact_rgb_bytes \
            alpha_policy_rejects_unknown_nested_fields \
            alpha_shape_is_jpeg_convert_only_and_requires_explicit_color_handling \
            generated_alpha_policy_binding_matches_the_serde_wire_shape \
            legacy_request_defaults_alpha_policy_to_none; do
            grep -qx "$test_name: test" image-alpha-contract-tests.txt
          done
          CARGO_INCREMENTAL=0 cargo test -p goop-core --test image_alpha_contract
          CARGO_INCREMENTAL=0 cargo test -p goop-config --lib presets::tests
          CARGO_INCREMENTAL=0 cargo test -p goop-queue --lib store::tests
      # The capability check earlier proves the ffmpeg features exist; this
      # runs the conversion pipeline against them, and is the only place the
      # `#[ignore]`d tests act as a standing gate rather than a manual one.
      #
      # Must come after the per-OS HEIC setup above: linking goop-converter
      # needs the static libheif those steps install. Placed earlier it fails
      # on Windows with `cannot open input file 'heif.lib'` — and passes on
      # macOS only because Homebrew's libheif masks the missing static one.
      - name: Subtitle conversions (real ffmpeg)
        shell: bash
        run: cargo test -p goop-converter --test subtitle_ffmpeg -- --ignored
      # Video containers, and the guard that no conversion plan names an
      # encoder the sidecar lacks. Both runners matter and neither is
      # redundant: the two ffmpeg sources are built with different library
      # sets, which is how AVI shipped naming `libxvid` — present in gyan's
      # Windows build, absent from the osxexperts macOS one, so every AVI
      # conversion needing a video encode failed on macOS only.
      - name: Video conversions (real ffmpeg)
        shell: bash
        run: cargo test -p goop-converter --test video_ffmpeg -- --ignored
      - name: Video controls (real ffmpeg)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_INCREMENTAL=0 cargo test -p goop-core --test video_contracts
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test video_controls -- --list | tee video-controls-tests.txt
          case "$RUNNER_OS" in
            macOS) expected_video_controls=39 ;;
            Windows) expected_video_controls=36 ;;
            *) echo "::error::unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          test "$(grep -c ': test$' video-controls-tests.txt)" -eq "$expected_video_controls"
          for test_name in \
            probe_reduces_exact_timing_facts_and_preserves_missing_or_malformed \
            probe_uses_stream_tick_and_matroska_tag_duration_fallbacks \
            presentation_bounds_use_the_greatest_pts_not_decode_order_tail \
            incomplete_stream_endpoints_disable_frame_rate_before_conversion \
            fit_within_resolves_landscape_portrait_rounding_and_no_enlargement \
            bundled_ffmpeg_preserves_vfr_intervals_and_converts_frame_counts_without_speed_change \
            bundled_ffmpeg_preserve_keeps_nonzero_bframe_timing_and_relative_audio_offset \
            bundled_ffmpeg_new_controls_cover_codec_container_matrix_and_stream_endpoints \
            bundled_ffmpeg_fit_within_decodes_marked_corners_upright_for_all_rotations; do
            grep -q "^${test_name}: test$" video-controls-tests.txt
          done
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test video_controls
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --example performance_baseline
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test video_controls -- --ignored --test-threads=1
      - name: Audio controls (real ffmpeg)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_INCREMENTAL=0 cargo test -p goop-core --test audio_contracts
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test audio_controls
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test audio_controls_ffmpeg -- --list | tee audio-controls-tests.txt
          test "$(grep -c ': test$' audio-controls-tests.txt)" -eq 6
          for test_name in \
            explicit_copy_and_custom_encode_publish_verified_audio_only_outputs \
            bundled_ffmpeg_covers_every_audio_target_bitrate_rate_and_channel_choice \
            bundled_ffmpeg_preserves_channel_and_resample_semantics \
            source_change_before_publication_fails_without_a_destination \
            selected_source_is_revalidated_immediately_before_execution \
            selected_source_is_revalidated_immediately_before_publication; do
            grep -q "^${test_name}: test$" audio-controls-tests.txt
          done
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test audio_controls_ffmpeg -- --include-ignored --test-threads=1
      - name: Audio track selection (real ffmpeg)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test track_selection
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test track_selection_ffmpeg -- --list | tee track-selection-tests.txt
          test "$(grep -c ': test$' track-selection-tests.txt)" -eq 4
          for test_name in \
            bundled_ffmpeg_selects_exact_multitrack_tones_and_preserves_diagnostics \
            bundled_ffmpeg_exposes_mixed_copy_compatibility_without_fallback \
            selected_multitrack_source_mutation_before_execution_is_rejected \
            selected_multitrack_source_mutation_before_publication_is_rejected; do
            grep -q "^${test_name}: test$" track-selection-tests.txt
          done
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test track_selection_ffmpeg -- --include-ignored --test-threads=1
      - name: Video stream policies (real ffmpeg)
        shell: bash
        run: |
          set -euo pipefail
          CARGO_INCREMENTAL=0 cargo test -p goop-core --test track_contracts
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test video_track_options -- --list | tee video-track-options-tests.txt
          test "$(grep -c ': test$' video-track-options-tests.txt)" -eq 13
          for test_name in \
            bundled_ffmpeg_proves_fixtureable_subtitle_copy_pairs \
            bundled_ffmpeg_rechecks_bound_source_before_run_and_publication \
            bundled_ffmpeg_verifies_mixed_audio_outcomes_payload_and_tones \
            capabilities_report_per_stream_reasons_and_policy_availability \
            copy_is_all_or_refuse_but_dropped_incompatible_streams_do_not_block \
            exact_maps_preserve_cross_family_source_order_and_independent_audio_processing \
            legacy_single_audio_video_plan_remains_unindexed_and_byte_stable \
            malformed_or_out_of_scope_source_facts_refuse_without_policy_narrowing \
            missing_codecs_cannot_be_hidden_by_none_and_capabilities_match_refusal \
            mp4_capabilities_require_a_supported_source_default_audio_stream \
            staged_timing_accepts_primary_start_normalization \
            staged_validation_checks_exact_count_order_metadata_disposition_and_timing \
            subtitle_copy_matrix_is_exact_for_copy_and_custom; do
            grep -q "^${test_name}: test$" video-track-options-tests.txt
          done
          CARGO_INCREMENTAL=0 cargo test -p goop-converter --test video_track_options -- --include-ignored --test-threads=1
      # The PDF surface, against the real mutool / gs / tesseract. Until now
      # nothing ran these: the only `--ignored` jobs were goop-converter's, so
      # every shipped PDF path — compress, OCR, page thumbnails, text and image
      # extraction — had zero execution coverage anywhere.
      #
      # Running them locally proved nothing either. The tests pointed a
      # resolver at src-tauri/bin, which stores `<name>-<triple>` while the
      # resolver looks for a bare `<name>`, so every lookup missed and fell
      # through to $PATH — Homebrew on a dev Mac. They now link the two layouts
      # together and assert the binary did NOT come from $PATH, which is what
      # makes this step meaningful on a runner that has neither on PATH.
      #
      # Both runners matter for the same reason the ffmpeg steps above give:
      # gs and tesseract load co-located libraries by different mechanisms per
      # platform, and the OCR pipeline shells out to two of them in sequence.
      - name: PDF pipeline (real mutool / gs / tesseract)
        shell: bash
        run: cargo test -p goop-pdf --lib -- --ignored
