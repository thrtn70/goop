name: audit
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    # Stays on ubuntu-24.04 (current LTS; libwebkit2gtk-4.1 lives here).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-directories: ~/.cargo/bin
      - name: System libs (Tauri 2 + image codecs)
        # v0.2.6: cmake added so jpegxl-sys's `vendored` feature can
        # build libjxl 0.11 from vendored source at compile time.
        # libjxl-dev is NOT installed — we use jpegxl-rs's vendored
        # feature to avoid the version-mismatch trap (apt ships 0.7,
        # we want 0.11). cmake is preinstalled on github runners but
        # we explicitly install it for resilience.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config cmake
      # v0.2.8: static HEIC decode stack. Pinned libde265 + libheif
      # built static by the script (every other codec OFF); apt's
      # libheif-dev is NOT used (it would dynamic-link and drift).
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .heif-deps
          key: heif-deps-${{ runner.os }}-${{ hashFiles('scripts/build-static-heif-deps.sh') }}
      - name: Static HEIC decode stack (libde265 + libheif)
        run: |
          ./scripts/build-static-heif-deps.sh
          echo "PKG_CONFIG_PATH=$PWD/.heif-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
      - name: Resolve target
        shell: bash
        run: echo "TARGET=$(rustc -vV | awk '/host/ {print $2}')" >> "$GITHUB_ENV"
      - name: Fetch sidecars (required for goop-tauri build)
        shell: bash
        run: ./scripts/fetch-sidecars.sh "$TARGET"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: Security audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  legal:
    # AGPL firewall — see LICENSING.md. Two checks: no `mupdf-*`
    # Rust crate may enter the workspace dependency graph (would link
    # AGPL into goop's binary), and no `mupdf.js`/`mupdf.wasm`/`@mupdf/*`
    # may be imported into the WebView (would load AGPL into goop's
    # app process). The mutool/gs binaries live behind Command::spawn
    # and are the only sanctioned crossing of the boundary.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Rust dep graph clear of mupdf-*
        run: |
          if cargo tree --workspace --prefix none --edges normal,build,dev 2>/dev/null | grep -i mupdf; then
            echo "::error::mupdf-* crate present in workspace dependency graph. Goop is MIT and must spawn mutool/gs as subprocesses only. See LICENSING.md."
            exit 1
          fi
      - name: Frontend free of mupdf.js / mupdf.wasm imports
        run: |
          if grep -rEn "from ['\"]mupdf|require\(['\"]mupdf|@mupdf|mupdf\.js|mupdf\.wasm" src/ shared/ 2>/dev/null; then
            echo "::error::mupdf.js / mupdf.wasm / @mupdf import in src/ or shared/. WebView is goop's app process — AGPL would cross the boundary. See LICENSING.md."
            exit 1
          fi

  sidecar-smoke:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Resolve target
        shell: bash
        run: echo "TARGET=$(rustc -vV | awk '/host/ {print $2}')" >> "$GITHUB_ENV"
      - name: Fetch sidecars
        shell: bash
        run: ./scripts/fetch-sidecars.sh "$TARGET"
      - name: Smoke test
        shell: bash
        run: |
          ls src-tauri/bin/
          # Verify binaries invoke
          "./src-tauri/bin/ffmpeg-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} -version
          "./src-tauri/bin/yt-dlp-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
          "./src-tauri/bin/gallery-dl-$TARGET"${{ matrix.os == 'windows-latest' && '.exe' || '' }} --version
      # v0.2.8: per-OS static HEIC stack + link guards. These graduated
      # from the Phase 0 spike (.github/workflows/heic-spike.yml,
      # deleted after the gate passed) so every PR re-proves the
      # static-link property the release builders rely on.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'macos-14'
        with:
          path: .heif-deps
          key: heif-deps-${{ runner.os }}-${{ hashFiles('scripts/build-static-heif-deps.sh') }}
      - name: Static HEIC stack (macOS)
        if: matrix.os == 'macos-14'
        run: |
          ./scripts/build-static-heif-deps.sh
          echo "PKG_CONFIG_PATH=$PWD/.heif-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
      - name: HEIC static link guard (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -euo pipefail
          cargo test -p goop-converter heic
          BIN=$(cargo test -p goop-converter --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null) | .executable' | head -1)
          # Strong form: nothing outside /usr/lib + /System may appear —
          # guards against any codec dylib leaking back into the link.
          LEAKS=$(otool -L "$BIN" | tail -n +2 | grep -v "/usr/lib/\|/System/" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::non-system dylib references found:"
            echo "$LEAKS"
            exit 1
          fi
          echo "static link guard passed."
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'windows-latest'
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-libheif-core-static
      - name: Static HEIC stack (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # [core] suppresses the port's default 'hevc' feature (x265
          # GPL encoder); libde265 is a core dependency so decode works.
          # x64-windows-static matches the repo's crt-static RUSTFLAGS.
          /c/vcpkg/vcpkg.exe install "libheif[core]:x64-windows-static"
          echo "VCPKGRS_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=C:/vcpkg" >> "$GITHUB_ENV"
      # Compile-check the Windows-only Rust paths on a real Windows
      # runner. cfg(windows) code in goop-queue::process_control was
      # not exercised by the Linux audit job, so v0.2.0 hit two
      # tag-time regressions (windows-sys feature mismatch + missing
      # ntdll exports). Cross-compiling on Linux is blocked by C-deps
      # (sqlite3, ring) requiring a Windows toolchain we don't want
      # to install in CI; running natively here is cheaper and 100%
      # faithful to the release builder. v0.2.8 extends it: the HEIC
      # decode tests run here (exercising the vcpkg static link), and
      # goop-tauri is checked so the crt-static flip is validated
      # across the full dependency tree (sqlite, ring, tauri) on every
      # PR instead of first failing at tag time.
      - name: Cargo check (Windows-only paths)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo check -p goop-queue --all-features
          cargo test -p goop-converter heic
          mkdir -p dist
          cargo check -p goop-tauri --all-features
