name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the draft release once, before any matrix builder runs. tauri-action
  # in a matrix has a known race: each runner does "find or create draft" and
  # when several see "no draft yet" they each create one, leaving multiple
  # drafts with the assets split across them. Pre-creating the release here
  # gives every builder a stable releaseId to attach to.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.upsert.outputs.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # The tag is the only thing that says "0.3.0". The three manifest
      # versions are bumped by hand and nothing reconciles them with it.
      #
      # The sharpest consequence is the in-app update check.
      # app_update::check compares the GitHub latest-release tag against
      # env!("CARGO_PKG_VERSION"), which Cargo.toml's [workspace.package]
      # version supplies to every crate via version.workspace = true. Tag
      # v0.3.0 with Cargo.toml still on 0.2.9 and the shipped build calls
      # itself 0.2.9, sees latest 0.3.0, and offers the user an update to the
      # binary they are already running — every launch, with no way out but
      # cutting another release. tauri.conf.json's version stamps the bundle
      # itself (CFBundleShortVersionString, the MSI ProductVersion Windows
      # Installer uses to decide whether an upgrade even applies, and the
      # version in the Goop_<version>_aarch64.dmg asset name); package.json's
      # is what the repo reports about itself.
      #
      # This runs BEFORE the upsert step deliberately. A guard placed after it
      # would abort having already created a draft release for the tag it just
      # rejected, leaving an orphan draft to delete by hand before the retag.
      #
      # $GITHUB_REF_NAME rather than ${{ github.ref_name }}: git ref names may
      # contain $, backtick, (, ), ; and | — everything needed to turn an
      # interpolated tag name into a command in a job holding contents: write.
      # The env var is inert.
      - name: Tag matches the version in every manifest
        run: |
          # Same strip the app does — app_update.rs's strip_v_prefix is
          # raw.strip_prefix('v').unwrap_or(raw).
          want="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])" || true)
          tauri=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])" || true)
          # Scoped to the [workspace.package] table. A bare /^version/ matches
          # today only by luck — it would pick up a version key in any table
          # added later, and every inline table under [workspace.dependencies]
          # already carries one. Track the current table header, take the first
          # quoted version inside [workspace.package], stop there. Matching the
          # quoted run also drops a trailing # comment.
          cargo=$(awk '
            /^[[:space:]]*\[/ { wp = ($0 ~ /^[[:space:]]*\[workspace\.package\][[:space:]]*$/); next }
            wp && /^[[:space:]]*version[[:space:]]*=/ {
              if (match($0, /"[^"]*"/)) { print substr($0, RSTART + 1, RLENGTH - 2); exit }
            }' Cargo.toml || true)
          echo "tag=$GITHUB_REF_NAME  package.json=$pkg  tauri.conf.json=$tauri  Cargo.toml=$cargo"
          # Parse first, compare second: a manifest that can't be read and a
          # manifest that disagrees have different fixes, so they get different
          # errors. Fail closed — awk exits 0 when it matches nothing, so a
          # renamed or reformatted [workspace.package] yields an empty string,
          # and an empty-vs-empty comparison would wave the release through.
          bad=0
          [ -n "$pkg" ]   || { echo "::error::could not read .version from package.json"; bad=1; }
          [ -n "$tauri" ] || { echo "::error::could not read .version from src-tauri/tauri.conf.json"; bad=1; }
          [ -n "$cargo" ] || { echo "::error::could not read version from Cargo.toml [workspace.package]"; bad=1; }
          if [ "$bad" -ne 0 ]; then
            echo "::error::a manifest version could not be parsed, so tag $GITHUB_REF_NAME cannot be verified — refusing to create a release"
            exit 1
          fi
          [ "$pkg"   = "$want" ] || { echo "::error::package.json version is '$pkg' but tag $GITHUB_REF_NAME expects '$want'"; bad=1; }
          [ "$tauri" = "$want" ] || { echo "::error::src-tauri/tauri.conf.json version is '$tauri' but tag $GITHUB_REF_NAME expects '$want'"; bad=1; }
          [ "$cargo" = "$want" ] || { echo "::error::Cargo.toml [workspace.package] version is '$cargo' but tag $GITHUB_REF_NAME expects '$want'"; bad=1; }
          if [ "$bad" -ne 0 ]; then
            echo "::error::tag/manifest version mismatch. Set all three to $want and commit, then retag: git tag -d $GITHUB_REF_NAME && git push origin :$GITHUB_REF_NAME && git tag $GITHUB_REF_NAME && git push origin $GITHUB_REF_NAME. No draft release was created."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $want in package.json, src-tauri/tauri.conf.json and Cargo.toml"
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        id: upsert
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // If we're re-running the workflow for an existing tag, reuse any
            // draft already attached to it instead of creating a duplicate.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
            });
            const existing = releases.find(r => r.tag_name === tag);
            if (existing) {
              core.info(`Reusing existing release ${existing.id} (${existing.html_url})`);
              return existing.id.toString();
            }
            const { data: created } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Goop ${tag}`,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${created.id} (${created.html_url})`);
            return created.id.toString();

  # Mirror the audit workflow's `legal` job at release time so a tag push
  # can't ship without the AGPL firewall enforced. See LICENSING.md.
  legal:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Rust dep graph clear of mupdf-*
        run: |
          if cargo tree --workspace --prefix none --edges normal,build,dev 2>/dev/null | grep -i mupdf; then
            echo "::error::mupdf-* crate present in workspace dependency graph. See LICENSING.md."
            exit 1
          fi
      - name: Frontend free of mupdf.js / mupdf.wasm imports
        run: |
          if grep -rEn "from ['\"]mupdf|require\(['\"]mupdf|@mupdf|mupdf\.js|mupdf\.wasm" src/ shared/ 2>/dev/null; then
            echo "::error::mupdf.js / mupdf.wasm / @mupdf import in src/ or shared/. See LICENSING.md."
            exit 1
          fi

  build:
    needs: [create-release, legal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,   bundle: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { targets: "${{ matrix.target }}" }
      # Restore from existing main-branch caches but don't save new ones.
      # Tag builds happen rarely (a few per quarter) and each adds ~500MB
      # to the 10GB cache quota; over time that fills up and the post-step
      # cache-save fails (e.g. v0.2.1's Windows builder hit the quota at
      # 9.4GB). save-if=false lets us keep the warm-start benefit without
      # accumulating tag-only caches forever.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22", cache: "npm" }
      # v0.2.8: static HEIC decode stack (libheif + libde265, no other
      # codecs). DEPENDENCY-PREP ONLY — the tauri-action invocation and
      # upload flow below are untouched. Nothing needs bundling at
      # packaging time because the link is fully static; audit.yml's
      # per-PR link guards enforce that property stays true.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'macos-14'
        with:
          path: .heif-deps
          key: heif-deps-${{ runner.os }}-${{ hashFiles('scripts/build-static-heif-deps.sh') }}
      - name: Static HEIC decode stack (macOS)
        if: matrix.os == 'macos-14'
        run: |
          ./scripts/build-static-heif-deps.sh
          echo "PKG_CONFIG_PATH=$PWD/.heif-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'windows-latest'
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-libheif-core-static
      - name: Static HEIC decode stack (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # [core] = no default 'hevc' feature (x265 GPL encoder);
          # libde265 rides as a core dependency. The static triplet
          # matches the repo-wide crt-static RUSTFLAGS.
          /c/vcpkg/vcpkg.exe install "libheif[core]:x64-windows-static"
          echo "VCPKGRS_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=C:/vcpkg" >> "$GITHUB_ENV"
      - name: Fetch sidecars
        shell: bash
        run: ./scripts/fetch-sidecars.sh "${{ matrix.target }}"
      - run: npm ci
      # The macOS sidecar fixes (gallery-dl/yt-dlp Library Validation, plus the
      # gs/tesseract @loader_path sibling dylibs) all depend on Tauri signing
      # every sidecar with the disable-library-validation entitlement. That
      # entitlement lives in the plist referenced by bundle.macOS.entitlements;
      # if it's absent from the checkout, Tauri signs the sidecars WITHOUT it
      # and the release silently ships binaries that SIGKILL on launch. The
      # plist is easy to leave untracked — fail loud here before building.
      - name: Verify macOS entitlements file is present
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          ent=$(node -e 'const c=JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")); process.stdout.write((c.bundle&&c.bundle.macOS&&c.bundle.macOS.entitlements)||"")')
          [ -n "$ent" ] || { echo "::error::bundle.macOS.entitlements is unset in tauri.conf.json"; exit 1; }
          [ -f "src-tauri/$ent" ] || { echo "::error::entitlements file 'src-tauri/$ent' (referenced by tauri.conf.json) is missing from the checkout — sidecars would be signed without disable-library-validation"; exit 1; }
          echo "entitlements present: src-tauri/$ent"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      # Smoke-test the PyInstaller sidecars INSIDE the signed .app. Tauri
      # ad-hoc-signs every sidecar with hardened runtime; the gallery-dl and
      # yt-dlp --onefile bundles can't load their embedded Python.framework
      # under Library Validation unless the disable-library-validation
      # entitlement is applied (see src-tauri/entitlements.plist). The
      # fetch-sidecars smoke check only ever runs the UNsigned binaries, so it
      # can't catch a signing regression — verify the post-signing binaries
      # here against the exact failure mode users hit (bootloader dlopen of the
      # extracted Python).
      - name: Verify signed sidecars run (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          # The Cargo workspace root is the repo root, so `tauri build` writes
          # the bundle under ./target — not ./src-tauri/target. Search both so
          # the check is robust to the workspace layout.
          #
          # `|| true` is load-bearing, not sloppy. src-tauri is a workspace
          # member, so src-tauri/target does not exist, and find exits 1 when
          # one of its roots is missing. `shell: bash` runs -eo pipefail, which
          # propagates that 1 through `head -1` and aborts the whole step at
          # this assignment — after a full macOS release compile, and silently,
          # because 2>/dev/null swallows find's complaint. This step postdates
          # v0.2.9 and has never run in a release, so nothing caught it. The
          # emptiness check on the next line is the real guard and still fails
          # closed.
          APP=$(find target src-tauri/target -type d -path "*/${{ matrix.target }}/release/bundle/macos/*.app" 2>/dev/null | head -1 || true)
          [ -n "$APP" ] || { echo "::error::no .app bundle found under (src-tauri/)target/${{ matrix.target }}/release/bundle/macos"; exit 1; }
          # gs and tesseract load their imaging/OCR dylibs (libtiff, libpng16,
          # libfreetype, libtesseract, libleptonica, libwebp, ...) via
          # @loader_path. Tauri's externalBin packaging copies only the binary,
          # so the dylibs ride in through bundle.macOS.files; confirm they
          # actually landed in Contents/MacOS before running the sidecars —
          # a missing dylib is the exact dyld-fault this guards against.
          dylibs=$(find "$APP/Contents/MacOS" -maxdepth 1 -name '*.dylib' | wc -l | tr -d ' ')
          echo "== $dylibs sibling dylib(s) in Contents/MacOS =="
          [ "$dylibs" -gt 0 ] || { echo "::error::no .dylib in Contents/MacOS — @loader_path deps were dropped from the bundle"; exit 1; }
          # gallery-dl/yt-dlp exercise the Python.framework load path; gs and
          # tesseract --version exercise the @loader_path dylib graph (they
          # dlopen libtiff/libfreetype/libleptonica/... to print their versions).
          # ffmpeg, ffprobe and mutool carry no sibling dylibs (static builds
          # against system frameworks only), so for them this is purely a
          # "does the signed, hardened-runtime binary launch at all" check —
          # which is the exact SIGKILL this whole step exists to catch. They
          # were in no verification loop anywhere until now.
          for bin in gallery-dl yt-dlp tesseract gs ffmpeg ffprobe mutool; do
            exe="$APP/Contents/MacOS/$bin"
            [ -x "$exe" ] || { echo "::error::$bin missing from Contents/MacOS"; exit 1; }
            # ffmpeg's option parser strips one leading dash, so `--version`
            # arrives as an unknown `-version` option: it prints the usage
            # banner and exits 8 (ffmpeg) / 1 (ffprobe). mutool exits 1 the
            # same way. Under -eo pipefail any of those aborts the release
            # build, and the banner on stdout makes it look like it worked.
            case "$bin" in
              ffmpeg|ffprobe) flag="-version" ;;
              mutool)         flag="-v" ;;
              *)              flag="--version" ;;
            esac
            echo "== $bin $flag (signed, in-bundle) =="
            "$exe" "$flag"
          done
          # `gs --version` exercises the dylib graph but NOT the bundled
          # Resource/lib tree (gs_init.ps, fonts, iccprofiles) that the real
          # PDF compress/thumbnail features reach via GS_LIB (set to the
          # gs-resources dir in src-tauri/src/lib.rs). A broken/missing
          # gs-resources bundle — invisible to --version — would only fault in
          # a user's hands ("Can't find initialization file gs_init.ps").
          # Assert the tree is actually in the bundle, then do one real render
          # with that exact GS_LIB.
          GSRES="$APP/Contents/Resources/gs-resources"
          for need in "Resource/Init/gs_init.ps" "Resource/Font"; do
            [ -e "$GSRES/$need" ] || { echo "::error::bundled gs-resources is missing $need"; exit 1; }
          done
          printf '%%!PS\n/Helvetica findfont 24 scalefont setfont 72 700 moveto (gs render smoke) show showpage\n' > "$RUNNER_TEMP/gs-smoke.ps"
          echo "== gs pngalpha render (GS_LIB=gs-resources) =="
          GS_LIB="$GSRES" "$APP/Contents/MacOS/gs" -q -dNOPAUSE -dBATCH -sDEVICE=pngalpha -r72 -o "$RUNNER_TEMP/gs-smoke.png" "$RUNNER_TEMP/gs-smoke.ps"
          [ -s "$RUNNER_TEMP/gs-smoke.png" ] || { echo "::error::gs produced no PNG — the bundled gs-resources / GS_LIB path is broken"; exit 1; }
          echo "gs rendered $(wc -c < "$RUNNER_TEMP/gs-smoke.png" | tr -d ' ') bytes from the bundled resource tree"

      # SHA-256 for the installers this runner just handed to tauri-action.
      # Neither platform is signed with a real identity — macOS is ad-hoc,
      # Windows is unsigned — so a published digest is the only way a user can
      # tell a truncated or proxy-mangled download from a good one, and
      # README's "Windows Defender flags the installer" entry tells them to do
      # exactly that.
      #
      # One <asset>.sha256 per installer, never a shared SHA256SUMS.txt: both
      # matrix legs write to ONE draft release, so a combined file is a
      # read-modify-write race with no lock. Uploading without deleting 422s;
      # deleting first means the last writer silently drops the other
      # platform's lines. Per-asset names are derived from artifacts only this
      # runner produced, so they cannot collide.
      #
      # Placed last on purpose. If this ran right after tauri-action and
      # failed, every later step would be skipped — including the signed
      # sidecar smoke test, which is the guard standing between us and
      # shipping binaries that SIGKILL on launch. Last position means a
      # checksum problem can never mask a correctness one.
      - name: SHA-256 the installers
        shell: bash
        run: |
          mkdir -p checksums
          # Same both-roots search, and the same `|| true`, as the sidecar step
          # above: src-tauri/target does not exist, find exits 1 on a missing
          # root, and -o pipefail would turn that into a silent step abort.
          # The count guard below is the real check.
          find target src-tauri/target -type f \
            -path "*/${{ matrix.target }}/release/bundle/*" \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.msi' \) \
            2>/dev/null | sort > checksums/.list || true
          count=$(wc -l < checksums/.list | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "::error::no installers found under (src-tauri/)target/${{ matrix.target }}/release/bundle — the release would publish checksums for nothing; check --bundles and the target dir layout"; exit 1; }
          # macos-14 has shasum (Perl) and no GNU coreutils; Git Bash on
          # windows-latest has sha256sum. Both emit the same two-space
          # `<hash>  <name>` form that `shasum -a 256 -c` and `sha256sum -c`
          # parse, so pick whichever exists rather than branching on the OS.
          if command -v sha256sum >/dev/null 2>&1; then SHA="sha256sum"
          elif command -v shasum >/dev/null 2>&1; then SHA="shasum -a 256"
          else echo "::error::neither sha256sum nor shasum is on PATH on ${{ matrix.os }} — checksums cannot be computed"; exit 1
          fi
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            base=$(basename "$f")
            # tauri-action renames exactly one artifact on upload: its
            # getAssetName turns Goop.app.tar.gz into Goop_<arch>.app.tar.gz.
            # Everything else keeps its on-disk name. File the digest under the
            # PUBLISHED name, or we ship a checksum for a filename that isn't
            # on the release. The upload step re-checks every name against the
            # real asset list.
            case "$base" in
              *.app.tar.gz) name="${base%.app.tar.gz}_${arch}.app.tar.gz" ;;
              *)            name="$base" ;;
            esac
            # `|| true` for the same reason as the find above: -o pipefail
            # would abort the step at this assignment and the guard on the
            # next line would never run, so a hashing failure would surface as
            # a bare red step with no annotation. The tool's own complaint
            # still reaches the log on stderr.
            hash=$($SHA "$f" | awk '{print $1}' || true)
            [ -n "$hash" ] || { echo "::error::$SHA produced no digest for $f"; exit 1; }
            printf '%s  %s\n' "$hash" "$name" > "checksums/${name}.sha256"
            # Prove the line we publish is one the tool users are told to run
            # can actually consume — same `-c -` form as
            # scripts/build-static-heif-deps.sh.
            printf '%s  %s\n' "$hash" "$f" | $SHA -c - > /dev/null \
              || { echo "::error::the digest for $name does not verify with '$SHA -c' — the published .sha256 would be unusable"; exit 1; }
            echo "  $hash  $name"
          done < checksums/.list
          rm -f checksums/.list
          echo "wrote $count checksum file(s) for ${{ matrix.target }}"

      # Attach the digests to the SAME draft release tauri-action just uploaded
      # the installers to. github-script + release_id rather than
      # `gh release upload`: gh resolves a release by TAG, and a draft is not
      # reachable at /releases/tags/<tag> — it works only through gh's
      # draft-listing fallback, which is one more untested moving part on a
      # step whose first real execution is the cut. The id is already threaded
      # into this job and this action is already pinned above.
      # Delete-then-upload mirrors tauri-action, so re-running the workflow
      # (create-release reuses the draft) doesn't 422.
      - name: Upload checksums to the draft release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const files = fs.readdirSync('checksums').filter(f => f.endsWith('.sha256')).sort();
            if (files.length === 0) {
              core.setFailed('no .sha256 files in ./checksums — the hashing step produced nothing to upload');
              return;
            }
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            for (const file of files) {
              // A digest names a release asset. If that asset is not on the
              // release the digest is unusable, and the likely cause is
              // tauri-action's getAssetName rewriting a name. Fail loud rather
              // than publish a checksum for a file nobody can download.
              const target = file.replace(/\.sha256$/, '');
              if (!assets.some(a => a.name === target)) {
                core.setFailed(`checksum ${file} names "${target}", which is not an asset on release ${release_id} — tauri-action's upload naming changed; fix the name mapping in the "SHA-256 the installers" step`);
                return;
              }
              // Clear any asset already holding this name. Factored out
              // because a retry has to repeat it: a client-side failure
              // (timeout, dropped socket) can still leave the asset persisted
              // server-side, and the next attempt would then 422 on the
              // duplicate name — turning one recoverable upload into three
              // reported failures.
              const clearName = async (list) => {
                const dupe = list.find(a => a.name === file);
                if (dupe) {
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: dupe.id });
                }
              };
              await clearName(assets);
              const data = fs.readFileSync(`checksums/${file}`, 'utf8');
              let err = null;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    owner, repo, release_id, name: file, data,
                    headers: {
                      'content-type': 'text/plain',
                      'content-length': Buffer.byteLength(data),
                    },
                  });
                  err = null;
                  break;
                } catch (e) {
                  err = e;
                  if (attempt === 3) break;
                  await new Promise(r => setTimeout(r, 2000 * attempt));
                  // Best effort: if this re-listing fails, the next upload
                  // attempt surfaces the real error anyway.
                  try {
                    const { data: current } = await github.rest.repos.listReleaseAssets({
                      owner, repo, release_id, per_page: 100,
                    });
                    await clearName(current);
                  } catch (ignored) {
                    core.info(`could not re-check assets before retrying ${file}: ${ignored.message}`);
                  }
                }
              }
              if (err) {
                core.setFailed(`uploading ${file} failed after 3 attempts: ${err.message} — the installers are already on the DRAFT release and are unaffected; re-run this workflow (create-release reuses the existing draft) before publishing`);
                return;
              }
              core.info(`uploaded ${file}`);
            }
            core.info(`attached ${files.length} checksum file(s) to release ${release_id}`);
