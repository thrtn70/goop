name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the draft release once, before any matrix builder runs. tauri-action
  # in a matrix has a known race: each runner does "find or create draft" and
  # when several see "no draft yet" they each create one, leaving multiple
  # drafts with the assets split across them. Pre-creating the release here
  # gives every builder a stable releaseId to attach to.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.upsert.outputs.result }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        id: upsert
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // If we're re-running the workflow for an existing tag, reuse any
            // draft already attached to it instead of creating a duplicate.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
            });
            const existing = releases.find(r => r.tag_name === tag);
            if (existing) {
              core.info(`Reusing existing release ${existing.id} (${existing.html_url})`);
              return existing.id.toString();
            }
            const { data: created } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Goop ${tag}`,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${created.id} (${created.html_url})`);
            return created.id.toString();

  # Mirror the audit workflow's `legal` job at release time so a tag push
  # can't ship without the AGPL firewall enforced. See LICENSING.md.
  legal:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Rust dep graph clear of mupdf-*
        run: |
          if cargo tree --workspace --prefix none --edges normal,build,dev 2>/dev/null | grep -i mupdf; then
            echo "::error::mupdf-* crate present in workspace dependency graph. See LICENSING.md."
            exit 1
          fi
      - name: Frontend free of mupdf.js / mupdf.wasm imports
        run: |
          if grep -rEn "from ['\"]mupdf|require\(['\"]mupdf|@mupdf|mupdf\.js|mupdf\.wasm" src/ shared/ 2>/dev/null; then
            echo "::error::mupdf.js / mupdf.wasm / @mupdf import in src/ or shared/. See LICENSING.md."
            exit 1
          fi

  build:
    needs: [create-release, legal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,   bundle: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { targets: "${{ matrix.target }}" }
      # Restore from existing main-branch caches but don't save new ones.
      # Tag builds happen rarely (a few per quarter) and each adds ~500MB
      # to the 10GB cache quota; over time that fills up and the post-step
      # cache-save fails (e.g. v0.2.1's Windows builder hit the quota at
      # 9.4GB). save-if=false lets us keep the warm-start benefit without
      # accumulating tag-only caches forever.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "20", cache: "npm" }
      # v0.2.8: static HEIC decode stack (libheif + libde265, no other
      # codecs). DEPENDENCY-PREP ONLY — the tauri-action invocation and
      # upload flow below are untouched. Nothing needs bundling at
      # packaging time because the link is fully static; audit.yml's
      # per-PR link guards enforce that property stays true.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'macos-14'
        with:
          path: .heif-deps
          key: heif-deps-${{ runner.os }}-${{ hashFiles('scripts/build-static-heif-deps.sh') }}
      - name: Static HEIC decode stack (macOS)
        if: matrix.os == 'macos-14'
        run: |
          ./scripts/build-static-heif-deps.sh
          echo "PKG_CONFIG_PATH=$PWD/.heif-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBHEIF_LINK=static" >> "$GITHUB_ENV"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: matrix.os == 'windows-latest'
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-libheif-core-static
      - name: Static HEIC decode stack (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # [core] = no default 'hevc' feature (x265 GPL encoder);
          # libde265 rides as a core dependency. The static triplet
          # matches the repo-wide crt-static RUSTFLAGS.
          /c/vcpkg/vcpkg.exe install "libheif[core]:x64-windows-static"
          echo "VCPKGRS_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=C:/vcpkg" >> "$GITHUB_ENV"
      - name: Fetch sidecars
        shell: bash
        run: ./scripts/fetch-sidecars.sh "${{ matrix.target }}"
      - run: npm ci
      # The macOS sidecar fixes (gallery-dl/yt-dlp Library Validation, plus the
      # gs/tesseract @loader_path sibling dylibs) all depend on Tauri signing
      # every sidecar with the disable-library-validation entitlement. That
      # entitlement lives in the plist referenced by bundle.macOS.entitlements;
      # if it's absent from the checkout, Tauri signs the sidecars WITHOUT it
      # and the release silently ships binaries that SIGKILL on launch. The
      # plist is easy to leave untracked — fail loud here before building.
      - name: Verify macOS entitlements file is present
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          ent=$(node -e 'const c=JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")); process.stdout.write((c.bundle&&c.bundle.macOS&&c.bundle.macOS.entitlements)||"")')
          [ -n "$ent" ] || { echo "::error::bundle.macOS.entitlements is unset in tauri.conf.json"; exit 1; }
          [ -f "src-tauri/$ent" ] || { echo "::error::entitlements file 'src-tauri/$ent' (referenced by tauri.conf.json) is missing from the checkout — sidecars would be signed without disable-library-validation"; exit 1; }
          echo "entitlements present: src-tauri/$ent"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      # Smoke-test the PyInstaller sidecars INSIDE the signed .app. Tauri
      # ad-hoc-signs every sidecar with hardened runtime; the gallery-dl and
      # yt-dlp --onefile bundles can't load their embedded Python.framework
      # under Library Validation unless the disable-library-validation
      # entitlement is applied (see src-tauri/entitlements.plist). The
      # fetch-sidecars smoke check only ever runs the UNsigned binaries, so it
      # can't catch a signing regression — verify the post-signing binaries
      # here against the exact failure mode users hit (bootloader dlopen of the
      # extracted Python).
      - name: Verify signed sidecars run (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          # The Cargo workspace root is the repo root, so `tauri build` writes
          # the bundle under ./target — not ./src-tauri/target. Search both so
          # the check is robust to the workspace layout.
          APP=$(find target src-tauri/target -type d -path "*/${{ matrix.target }}/release/bundle/macos/*.app" 2>/dev/null | head -1)
          [ -n "$APP" ] || { echo "::error::no .app bundle found under (src-tauri/)target/${{ matrix.target }}/release/bundle/macos"; exit 1; }
          # gs and tesseract load their imaging/OCR dylibs (libtiff, libpng16,
          # libfreetype, libtesseract, libleptonica, libwebp, ...) via
          # @loader_path. Tauri's externalBin packaging copies only the binary,
          # so the dylibs ride in through bundle.macOS.files; confirm they
          # actually landed in Contents/MacOS before running the sidecars —
          # a missing dylib is the exact dyld-fault this guards against.
          dylibs=$(find "$APP/Contents/MacOS" -maxdepth 1 -name '*.dylib' | wc -l | tr -d ' ')
          echo "== $dylibs sibling dylib(s) in Contents/MacOS =="
          [ "$dylibs" -gt 0 ] || { echo "::error::no .dylib in Contents/MacOS — @loader_path deps were dropped from the bundle"; exit 1; }
          # gallery-dl/yt-dlp exercise the Python.framework load path; gs and
          # tesseract --version exercise the @loader_path dylib graph (they
          # dlopen libtiff/libfreetype/libleptonica/... to print their versions).
          for bin in gallery-dl yt-dlp tesseract gs; do
            exe="$APP/Contents/MacOS/$bin"
            [ -x "$exe" ] || { echo "::error::$bin missing from Contents/MacOS"; exit 1; }
            echo "== $bin --version (signed, in-bundle) =="
            "$exe" --version
          done
          # `gs --version` exercises the dylib graph but NOT the bundled
          # Resource/lib tree (gs_init.ps, fonts, iccprofiles) that the real
          # PDF compress/thumbnail features reach via GS_LIB (set to the
          # gs-resources dir in src-tauri/src/lib.rs). A broken/missing
          # gs-resources bundle — invisible to --version — would only fault in
          # a user's hands ("Can't find initialization file gs_init.ps").
          # Assert the tree is actually in the bundle, then do one real render
          # with that exact GS_LIB.
          GSRES="$APP/Contents/Resources/gs-resources"
          for need in "Resource/Init/gs_init.ps" "Resource/Font"; do
            [ -e "$GSRES/$need" ] || { echo "::error::bundled gs-resources is missing $need"; exit 1; }
          done
          printf '%%!PS\n/Helvetica findfont 24 scalefont setfont 72 700 moveto (gs render smoke) show showpage\n' > "$RUNNER_TEMP/gs-smoke.ps"
          echo "== gs pngalpha render (GS_LIB=gs-resources) =="
          GS_LIB="$GSRES" "$APP/Contents/MacOS/gs" -q -dNOPAUSE -dBATCH -sDEVICE=pngalpha -r72 -o "$RUNNER_TEMP/gs-smoke.png" "$RUNNER_TEMP/gs-smoke.ps"
          [ -s "$RUNNER_TEMP/gs-smoke.png" ] || { echo "::error::gs produced no PNG — the bundled gs-resources / GS_LIB path is broken"; exit 1; }
          echo "gs rendered $(wc -c < "$RUNNER_TEMP/gs-smoke.png" | tr -d ' ') bytes from the bundled resource tree"
