name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Create the draft release once, before any matrix builder runs. tauri-action
  # in a matrix has a known race: each runner does "find or create draft" and
  # when several see "no draft yet" they each create one, leaving multiple
  # drafts with the assets split across them. Pre-creating the release here
  # gives every builder a stable releaseId to attach to.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.upsert.outputs.result }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        id: upsert
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // If we're re-running the workflow for an existing tag, reuse any
            // draft already attached to it instead of creating a duplicate.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
            });
            const existing = releases.find(r => r.tag_name === tag);
            if (existing) {
              core.info(`Reusing existing release ${existing.id} (${existing.html_url})`);
              return existing.id.toString();
            }
            const { data: created } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Goop ${tag}`,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${created.id} (${created.html_url})`);
            return created.id.toString();

  # Mirror the audit workflow's `legal` job at release time so a tag push
  # can't ship without the AGPL firewall enforced. See LICENSING.md.
  legal:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Rust dep graph clear of mupdf-*
        run: |
          if cargo tree --workspace --prefix none --edges normal,build,dev 2>/dev/null | grep -i mupdf; then
            echo "::error::mupdf-* crate present in workspace dependency graph. See LICENSING.md."
            exit 1
          fi
      - name: Frontend free of mupdf.js / mupdf.wasm imports
        run: |
          if grep -rEn "from ['\"]mupdf|require\(['\"]mupdf|@mupdf|mupdf\.js|mupdf\.wasm" src/ shared/ 2>/dev/null; then
            echo "::error::mupdf.js / mupdf.wasm / @mupdf import in src/ or shared/. See LICENSING.md."
            exit 1
          fi

  build:
    needs: [create-release, legal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,   bundle: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { targets: "${{ matrix.target }}" }
      # Restore from existing main-branch caches but don't save new ones.
      # Tag builds happen rarely (a few per quarter) and each adds ~500MB
      # to the 10GB cache quota; over time that fills up and the post-step
      # cache-save fails (e.g. v0.2.1's Windows builder hit the quota at
      # 9.4GB). save-if=false lets us keep the warm-start benefit without
      # accumulating tag-only caches forever.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "20", cache: "npm" }
      # v0.2.6: per-platform C-lib install for libheif (libjxl is
      # built from vendored source via jpegxl-rs's `vendored` feature
      # — needs cmake, which is preinstalled on both runners).
      - name: Install libheif (macOS)
        if: matrix.os == 'macos-14'
        run: brew install libheif pkg-config
      - name: Install libheif (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # vcpkg is preinstalled at C:/vcpkg on windows-latest runners.
          # Install libheif via vcpkg; configure pkg-config to find
          # libheif.pc inside the vcpkg installed tree so libheif-rs's
          # build.rs probe succeeds.
          /c/vcpkg/vcpkg.exe install libheif:x64-windows
          # Install pkg-config so libheif-rs's build.rs probe works.
          choco install pkgconfiglite -y
          # Surface the vcpkg-installed libheif.pc on PKG_CONFIG_PATH
          # for the cargo build below.
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $GITHUB_ENV
          # Surface the vcpkg-installed lib + bin dirs so the linker
          # and runtime loader can find libheif at build + load time.
          echo "C:/vcpkg/installed/x64-windows/bin" >> $GITHUB_PATH
          echo "LIB=C:/vcpkg/installed/x64-windows/lib;${LIB:-}" >> $GITHUB_ENV
      - name: Fetch sidecars
        shell: bash
        run: ./scripts/fetch-sidecars.sh "${{ matrix.target }}"
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      # v0.2.6: post-build per-platform C-lib bundling so the
      # installed .app / .exe doesn't need the user's machine to have
      # libheif installed. libjxl is statically linked via the vendored
      # build so it doesn't need this step.
      - name: Bundle libheif dylib (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Goop.app"
          BIN="$APP/Contents/MacOS/Goop"
          if [ ! -f "$BIN" ]; then
            echo "::error::expected Goop binary at $BIN"
            exit 1
          fi
          # Re-use the same BFS dylib bundler that's been working for
          # tesseract since v0.2.4 (defined in scripts/macos-dylib-bundle.sh).
          # It walks the binary's non-system dylib deps, copies them
          # into Contents/MacOS/, and rewrites install names to
          # @loader_path/<basename>.
          source ./scripts/macos-dylib-bundle.sh
          bundle_macos_dylibs "$BIN"
          # Ad-hoc resign so macOS Gatekeeper doesn't reject the
          # modified binary on first launch.
          codesign --force --deep --sign - "$APP"
      - name: Bundle libheif DLL (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          # Copy libheif's runtime DLLs from vcpkg into the bundle
          # staging dir so the NSIS / MSI installers carry them
          # alongside Goop.exe.
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release"
          # Required: libheif itself + its primary HEIC decoder. If
          # either is missing the installer would ship a broken HEIC
          # path; fail the build instead of silently producing one.
          cp -v C:/vcpkg/installed/x64-windows/bin/libheif.dll "$BUNDLE_DIR/"
          cp -v C:/vcpkg/installed/x64-windows/bin/libde265.dll "$BUNDLE_DIR/"
          # Optional codec DLLs — vcpkg may not have built them
          # depending on the libheif triplet's feature toggles.
          # Missing optional codecs degrade gracefully (libheif
          # returns a "codec not available" error for that input).
          cp -v C:/vcpkg/installed/x64-windows/bin/libx265.dll "$BUNDLE_DIR/" || echo "warning: libx265.dll absent — HEVC encode path disabled"
          cp -v C:/vcpkg/installed/x64-windows/bin/libsharpyuv.dll "$BUNDLE_DIR/" || echo "warning: libsharpyuv.dll absent"
          cp -v C:/vcpkg/installed/x64-windows/bin/aom.dll "$BUNDLE_DIR/" || echo "warning: aom.dll absent — AVIF codec disabled in libheif"
